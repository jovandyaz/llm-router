name: Refresh model snapshot

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm snapshot:refresh

      - name: Discard a change that only moves the snapshot date
        run: |
          if git diff --quiet -I '^export const MODEL_INDEX_SNAPSHOT_DATE' -- src/catalog/model-index.snapshot.ts; then
            git checkout -- src/catalog/model-index.snapshot.ts
          fi

      - run: pnpm typecheck
      - run: pnpm test

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: src/catalog/model-index.snapshot.ts
          branch: chore/refresh-model-snapshot
          delete-branch: true
          sign-commits: true
          commit-message: 'chore: refresh model index snapshot'
          title: 'chore: refresh model index snapshot'
          body: |
            Weekly re-read of models.dev and OpenRouter `/api/v1/models` by `pnpm snapshot:refresh`.

            Typecheck and tests passed against the new snapshot in the workflow run. Add a changeset before merging if this should ship in a release.
